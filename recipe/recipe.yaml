context:
  version: "0.5.7"

package:
  name: rattler
  version: ${{ version }}

source:
  - url: https://github.com/conda/rattler/archive/rattler-bin-v${{ version }}.tar.gz
    sha256: 9b8193aaab3bedd29fe1821e1f779c3428916effebcf35fe8f43f63e21b6a75a
  - url: https://github.com/baszalmstra/libsolv/archive/068739980a909f39b647b9a96146e58e80741d1e.tar.gz
    target_directory: crates/rattler_libsolv_c/libsolv
    sha256: 4cf3e8a09e6710b5452be43c103aef9d33a08f31db1f5f870492045697d53161

build:
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      # Link conda-forge's aws-lc (shared) instead of compiling the copy
      # bundled with aws-lc-sys.
      AWS_LC_SYS_STATIC: "0"
    content:
      # aws-lc-sys expects a plain <prefix>/{include,lib} layout, but the
      # conda-forge aws-lc package installs its headers under include/aws-lc
      # so they do not clash with openssl. Assemble that layout from links and
      # point aws-lc-sys at the Rust bindings the package ships. Only the
      # aws-lc libraries go into lib/: aws-lc-sys looks for libcrypto before
      # libcrypto-awslc, and on linux openssl's libcrypto sits in $PREFIX/lib.
      - if: unix
        then:
          - export OPENSSL_DIR=$PREFIX
          - mkdir -p aws-lc-sysroot/lib
          - ln -s $PREFIX/include/aws-lc aws-lc-sysroot/include
          - ln -s $PREFIX/lib/libcrypto-awslc.* $PREFIX/lib/libssl-awslc.* aws-lc-sysroot/lib/
          - export AWS_LC_SYS_SYSTEM_DIR=$SRC_DIR/aws-lc-sysroot
          - export AWS_LC_SYS_SYSTEM_BINDINGS=$PREFIX/share/rust/aws_lc_bindings.rs
        else:
          - mkdir aws-lc-sysroot
          - mklink /J aws-lc-sysroot\include %LIBRARY_INC%\aws-lc
          - mklink /J aws-lc-sysroot\lib %LIBRARY_LIB%
          - mklink /J aws-lc-sysroot\bin %LIBRARY_BIN%
          - set AWS_LC_SYS_SYSTEM_DIR=%SRC_DIR%\aws-lc-sysroot
          - set AWS_LC_SYS_SYSTEM_BINDINGS=%LIBRARY_PREFIX%\share\rust\aws_lc_bindings.rs
      - if: ppc64le
        then:
          # rust-lld, which rustc uses by default, cannot handle the inline-PLT
          # relocations gcc emits for ppc64le (R_PPC64_PLT16_HA, R_PPC64_PLTSEQ,
          # R_PPC64_PLTCALL) in the vendored libsolv objects. gcc honors the last
          # -fuse-ld, so this falls back to the GNU bfd linker. It has to go into
          # RUSTFLAGS rather than CARGO_BUILD_RUSTFLAGS: cargo-auditable passes its
          # own flags via CARGO_ENCODED_RUSTFLAGS, which shadows the config-level
          # CARGO_BUILD_RUSTFLAGS but preserves RUSTFLAGS.
          - export RUSTFLAGS="${RUSTFLAGS:-${CARGO_BUILD_RUSTFLAGS:-}} -C link-arg=-fuse-ld=bfd"
      - cd crates/rattler-bin
      - cargo-bundle-licenses --format yaml --output ../../THIRDPARTY.yml
      - cargo auditable install --no-track --locked --features native-tls,s3,gcs,oauth,sigstore --no-default-features --root ${{ PREFIX }} --path .
      - if: unix
        then:
          - mkdir -p $PREFIX/etc/pixi/rattler
          - touch $PREFIX/etc/pixi/rattler/global-ignore-conda-prefix
          - mkdir -p $PREFIX/share/zsh/site-functions $PREFIX/share/bash-completion/completions $PREFIX/share/fish/vendor_completions.d
          # cargo does not pass LDFLAGS to the final link, so the binary carries no
          # rpath until rattler-build relinks it at packaging time. Running it here
          # - under qemu when cross-compiling - needs this to find libcrypto-awslc
          # and libssl.
          - export LD_LIBRARY_PATH="$PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          - export DYLD_FALLBACK_LIBRARY_PATH="$PREFIX/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
          - $PREFIX/bin/rattler completion --shell zsh > $PREFIX/share/zsh/site-functions/_rattler
          - $PREFIX/bin/rattler completion --shell bash > $PREFIX/share/bash-completion/completions/rattler
          - $PREFIX/bin/rattler completion --shell fish > $PREFIX/share/fish/vendor_completions.d/rattler.fish
          - mkdir -p $PREFIX/share/agent-skills/rattler
          - $PREFIX/bin/rattler skill > $PREFIX/share/agent-skills/rattler/SKILL.md
        else:
          # crypto-awslc.dll lives in Library\bin; make sure rattler.exe finds it.
          - set PATH=%LIBRARY_BIN%;%PATH%
          - mkdir %PREFIX%\etc\pixi\rattler
          - touch %PREFIX%\etc\pixi\rattler\global-ignore-conda-prefix
          - mkdir %PREFIX%\share\agent-skills\rattler
          - '%PREFIX%\bin\rattler.exe skill > %PREFIX%\share\agent-skills\rattler\SKILL.md'
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - cmake
    - if: unix
      then: make
  host:
    # Needs the build that ships share/rust/aws_lc_bindings.rs.
    - aws-lc >=5.11.0
    - if: linux
      then:
        - openssl

tests:
  - script:
      - rattler --version
  - script:
      - if: unix
        then: agentskills validate $CONDA_PREFIX/share/agent-skills/rattler
        else: 'agentskills validate %CONDA_PREFIX%\share\agent-skills\rattler'
    requirements:
      run:
        - skills-ref
  - package_contents:
      bin:
        - rattler
      files:
        - etc/pixi/rattler/global-ignore-conda-prefix
        - share/agent-skills/rattler/SKILL.md
        - if: unix
          then:
            - share/bash-completion/completions/rattler
            - share/fish/vendor_completions.d/rattler.fish
            - share/zsh/site-functions/_rattler
      strict: true

about:
  homepage: https://github.com/conda/rattler
  documentation: https://docs.rs/crate/rattler-bin
  summary: Rust binary for common Conda operations
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - crates/rattler_libsolv_c/libsolv/LICENSE.BSD
    - THIRDPARTY.yml
  repository: https://github.com/conda/rattler/tree/main/crates/rattler-bin

extra:
  recipe-maintainers:
    - baszalmstra
    - pavelzw
